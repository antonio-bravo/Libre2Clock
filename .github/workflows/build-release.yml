name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (dejar vacio para usar 1.YYYYMMDD.HHmmss)"
        required: false
        default: ""

env:
  JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
  NODE_OPTIONS: "--no-deprecation"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Set Version
        id: set_version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            V_AUTO="1.$(date -u +'%Y%m%d.%H%M%S')"
            echo "version=$V_AUTO" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - build_type: release
            task: assembleRelease
          - build_type: debug
            task: assembleDebug
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            --no-parallel \
            -Djava.awt.headless=true \
            -Dkotlin.daemon.enabled=false \
            -Pkotlin.incremental=false \
            -PappVersion=${{ needs.prepare.outputs.version }} \
            clean ${{ matrix.task }}

      - name: Prepare Artifact
        run: |
          DIR="app/build/outputs/apk/${{ matrix.build_type }}/"
          APK=$(find $DIR -name "*.apk" | head -n 1)
          SUFFIX="${{ matrix.build_type == 'debug' && '_debug' || '' }}"
          DEST="libre2clock-v${{ needs.prepare.outputs.version }}${SUFFIX}.apk"
          cp "$APK" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.build_type }}
          path: ${{ env.APK_PATH }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "Libre2Clock v$VERSION" \
            --generate-notes \
            libre2clock-v$VERSION.apk \
            libre2clock-v${VERSION}_debug.apk
